[package]
name = "riptide"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A small BitTorrent v1 client built around explicit piece state and verified writes"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
hex = "0.4"
rand = "0.8"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
tokio = { version = "1.0", features = ["full"] }

[dev-dependencies]
tempfile = "3.13"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
